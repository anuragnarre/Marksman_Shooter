services:
  # 1. API Backend (NestJS)
  - type: web
    name: marksman-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build:api
    startCommand: cd apps/api && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: DATABASE_URL
        fromDatabase:
          name: marksman-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: marksman-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: marksman-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGINS
        value: "https://marksmanshooter.in,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: VISION_SERVICE_URL
        sync: false

  # 2. Web Frontend (Next.js)
  - type: web
    name: marksman-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: cd apps/web && npx --yes serve@latest out -l tcp://0.0.0.0:$PORT
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://api.marksmanshooter.in"
      - key: NEXT_PUBLIC_WS_URL
        value: "https://api.marksmanshooter.in"

  # 3. Vision Microservice (FastAPI)
  - type: web
    name: marksman-vision
    runtime: python
    plan: free
    rootDir: apps/vision
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # 4. Redis Cache & Queue
  - type: redis
    name: marksman-redis
    plan: free
    ipAllowList: [] # Allow all internal connections

databases:
  # 5. PostgreSQL Database
  - name: marksman-db
    databaseName: shooting-platform
    user: marksman
    plan: free
