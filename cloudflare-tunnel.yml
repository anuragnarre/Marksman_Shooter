# Cloudflare Tunnel Configuration (cloudflared)
# Documentation: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/

tunnel: <YOUR_CLOUDFLARE_TUNNEL_UUID>
credentials-file: /etc/cloudflared/<YOUR_CLOUDFLARE_TUNNEL_UUID>.json

ingress:
  # 1. Shooter App API (NestJS + Socket.IO WebSockets on port 3001)
  - hostname: api.yourdomain.com
    service: http://shooter-api:3001
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # 2. Range Management API (NestJS + Socket.IO WebSockets on port 3003)
  - hostname: range-api.yourdomain.com
    service: http://range-api:3003
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # 3. Python FastAPI Target Vision Service (port 8000)
  - hostname: vision.yourdomain.com
    service: http://vision-service:8000
    originRequest:
      noTLSVerify: true
      connectTimeout: 60s

  # Catch-all rule (required by cloudflared)
  - service: http_status:404

