name: CI Deployment Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Shared Types
      run: npm run build:shared

    - name: Build Next.js App
      run: npm run build:web
      env:
        NEXT_PUBLIC_API_URL: https://api.marksmanshooter.in

    - name: Build NestJS API
      run: npm run build:api

    - name: Run Linter
      run: npm --prefix apps/web run lint --if-present
