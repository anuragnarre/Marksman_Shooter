<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background with rounded corners -->
  <rect width="64" height="64" rx="12" fill="#080A0F"/>

  <!-- Outer ring (faint) -->
  <circle cx="32" cy="32" r="27" stroke="#F5A623" stroke-width="1.5" opacity="0.55"/>

  <!-- Mid ring -->
  <circle cx="32" cy="32" r="19" stroke="#F5A623" stroke-width="1.5" opacity="0.85"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="8" stroke="#F5A623" stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#F5A623"/>

  <!-- Crosshair — top -->
  <line x1="32" y1="4"  x2="32" y2="22" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crosshair — bottom -->
  <line x1="32" y1="42" x2="32" y2="60" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crosshair — left -->
  <line x1="4"  y1="32" x2="22" y2="32" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crosshair — right -->
  <line x1="42" y1="32" x2="60" y2="32" stroke="#F5A623" stroke-width="1.5" stroke-linecap="round"/>
</svg>
